# Vibra on the Hostinger VPS -- installed as /etc/nginx/sites-available/vibra.conf
# Only defines Vibra's two hostnames; other sites on this server are untouched.
# HTTP only at first: `certbot --nginx` adds the HTTPS blocks after DNS points here.

# WebSocket URLs carry the JWT in ?token=..., so never log query strings.
log_format vibra_noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $vibra_connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Website (static frontend) ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vibra.sahilmuhd.com;

    root /srv/vibra/Front-end;
    index index.html;
    access_log /var/log/nginx/vibra-web.access.log vibra_noquery;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # The app is a few files; always fetch fresh JS/HTML after a deploy.
    location ~* \.(?:html|js)$ {
        add_header Cache-Control "no-cache";
    }
    location /tests/ { return 404; }
}

# --- API + WebSockets --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.vibra.sahilmuhd.com;

    access_log /var/log/nginx/vibra-api.access.log vibra_noquery;
    client_max_body_size 5m;

    location /static/ {
        alias /srv/vibra/Back-end/staticfiles/;
        expires 30d;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vibra_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # rooms stay open for a long time
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
